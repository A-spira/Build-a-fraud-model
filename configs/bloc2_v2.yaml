# Bloc 2 v2 — comparaison élargie (ML + DL) sous une nouvelle règle pré-enregistrée.
#
# Source de vérité de tous les paramètres de la v2. La v1 (configs/bloc2.yaml)
# reste intacte et reproductible. Justification de chaque choix :
# reports/bloc2_v2_decisions.md. Chemins relatifs à la racine du projet.

seed: 42

paths:
  data: data/raw/carclaims.csv
  models_dir: models/v2                    # gitignoré, régénéré par `make train-v2`
  predictions_dir: reports/v2/predictions  # interfaces pour le bloc 4
  results_dir: reports/v2/results
  figures_dir: reports/v2/figures
  report: reports/v2/model_comparison.md
  smoke_dir: build/v2/smoke                # sorties du mode --smoke, jamais committées
  pseudo_dir: build/v2/pseudo              # sorties du mode --pseudo, jamais committées

mlflow:
  tracking_uri: sqlite:///mlflow.db
  artifact_root: mlartifacts
  experiment: fraud-bloc2-v2

split:                                     # inchangé (v1)
  order_col: PolicyNumber
  year_col: Year
  train_years: [1994, 1995]
  test_years: [1996]
  pseudo:
    train_years: [1994]
    test_years: [1995]

cv:
  # v1 : TimeSeriesSplit(5), le fold 1 n'apprenait que sur 1 892 lignes.
  # v2 : chaque fold apprend au moins sur toute l'année 1994 ; 1995 est
  # découpé en n_splits blocs contigus de même taille (à une ligne près).
  scheme: anchored
  initial_train_years: [1994]
  n_splits: 4
  min_frauds_per_fold: 50

preprocessing:
  # v1 : un ColumnTransformer unique (scheme absent = shared_v1).
  # v2 : étage A commun (nettoyage du contrat bloc 1), puis étage B propre à
  # chaque famille (one-hot + standardisation, ou catégories natives).
  scheme: two_stage
  rare_threshold: 30

features:
  excluded: [PolicyNumber, FraudFound, y, Year, VehicleCategory]
  sets:
    fs_basepolicy:
      drop: [PolicyType]
      interactions: [[Fault, BasePolicy]]  # croisements de logreg_int
    fs_policytype:
      drop: [BasePolicy]
      interactions: [[Fault, PolicyType]]
  reference_set: fs_basepolicy
  compared_sets: [fs_basepolicy]           # v2 : fs_policytype n'est plus qu'une ablation
  sensitive_ablation: [Sex]

metrics:
  primary: average_precision
  ks: [0.05, 0.10, 0.20]

tuning:
  n_iter: 40
  smoke_n_iter: 3
  scoring: average_precision
  n_jobs: -1

baselines:
  business_cells: [Fault, BasePolicy]

# Modèles de référence : ni tunés, ni candidats à la sélection. Ils servent de
# barre à battre sur le holdout (étape 3).
references:
  logreg_v1:
    family: logreg
    feature_set: fs_basepolicy
    preprocessing: shared_v1               # le pipeline exact de la v1
    # Copié de reports/results/best_params.json (v1) ; vérifié par un test.
    params: {C: 63.95288218539363, class_weight: null}

# Paramètres fixes (non tunés). Le parallélisme est porté par la recherche :
# chaque estimateur tourne sur un seul cœur (déterminisme).
estimators:
  logreg:
    solver: lbfgs
    max_iter: 5000
  logreg_int:
    solver: lbfgs
    max_iter: 5000
  ebm:
    n_jobs: 1
  rf:
    n_estimators: 500
    n_jobs: 1
  brf:
    n_estimators: 500
    sampling_strategy: all                 # Balanced RF (Chen, Liaw & Breiman, 2004)
    replacement: true
    bootstrap: false
    n_jobs: 1
  svm:
    kernel: rbf
    cache_size: 1000
  xgb:
    tree_method: hist
    eval_metric: aucpr
    n_jobs: 1
  catboost:
    boosting_type: Ordered                 # contre le « prediction shift » sur petit n
    thread_count: 1
  mlp:
    max_epochs: 200
    patience: 15                           # arrêt précoce sur la PR-AUC de validation
    validation_fraction: 0.15              # la fin (temporelle) du train du fold
    n_seeds: 5                             # moyenne de 5 réseaux (variance des NN)
  stacking:
    members: [logreg, svm, xgb]            # inchangé (v1)
    inner_cv_splits: 5
    final_C: 1.0
  ensemble:
    members: [ebm, catboost, mlp]          # fixé d'avance, choisi pour la diversité

search_spaces:
  logreg:
    C: {dist: loguniform, low: 0.001, high: 100.0}
    class_weight: {dist: choice, values: [null, balanced]}
  logreg_int:
    C: {dist: loguniform, low: 0.001, high: 100.0}
    class_weight: {dist: choice, values: [null, balanced]}
  ebm:
    max_leaves: {dist: randint, low: 2, high: 3}
    learning_rate: {dist: loguniform, low: 0.005, high: 0.05}
    min_samples_leaf: {dist: randint, low: 2, high: 50}
    interactions: {dist: choice, values: [0, 5, 10, 25]}   # 0 = GAM pur
  rf:
    max_features: {dist: choice, values: [sqrt, 0.2, 0.33, 0.5]}
    min_samples_leaf: {dist: randint, low: 1, high: 50}
    class_weight: {dist: choice, values: [null, balanced_subsample]}
  brf:
    max_features: {dist: choice, values: [sqrt, 0.2, 0.33, 0.5]}
    min_samples_leaf: {dist: randint, low: 1, high: 50}
  svm:
    C: {dist: loguniform, low: 0.01, high: 100.0}
    gamma: {dist: loguniform, low: 0.0001, high: 1.0}
    class_weight: {dist: choice, values: [null, balanced]}
  xgb:
    n_estimators: {dist: randint, low: 100, high: 800}
    max_depth: {dist: randint, low: 2, high: 6}
    learning_rate: {dist: loguniform, low: 0.01, high: 0.3}
    subsample: {dist: uniform, low: 0.6, high: 1.0}
    colsample_bytree: {dist: uniform, low: 0.5, high: 1.0}
    min_child_weight: {dist: uniform, low: 1.0, high: 10.0}
    reg_lambda: {dist: loguniform, low: 0.01, high: 10.0}
    scale_pos_weight: {dist: choice, values: [1, neg_pos_ratio]}
  catboost:
    iterations: {dist: randint, low: 200, high: 1500}
    learning_rate: {dist: loguniform, low: 0.01, high: 0.3}
    depth: {dist: randint, low: 3, high: 8}
    l2_leaf_reg: {dist: loguniform, low: 1.0, high: 30.0}
    auto_class_weights: {dist: choice, values: [null, Balanced]}
  mlp:
    hidden_layers: {dist: choice, values: [[64], [128, 64], [256, 128]]}
    max_embedding_dim: {dist: choice, values: [4, 8, 16]}
    dropout: {dist: uniform, low: 0.0, high: 0.5}
    learning_rate: {dist: loguniform, low: 0.0001, high: 0.01}
    weight_decay: {dist: loguniform, low: 0.000001, high: 0.01}
    batch_size: {dist: choice, values: [128, 256, 512]}
    pos_weight: {dist: choice, values: [1, neg_pos_ratio]}

bootstrap:
  n_resamples: 2000
  confidence: 0.95

# --------------------------------------------------------------------------- #
# Règle de décision v2 PRÉ-ENREGISTRÉE. Commitée avant la CV complète v2 et
# avant la seconde lecture de 1996. Justification : reports/bloc2_v2_decisions.md §4.
# --------------------------------------------------------------------------- #
decision_rule:
  metric: pr_auc
  # Du plus simple au plus complexe (explicabilité, coût opérationnel).
  simplicity_order: [logreg, logreg_int, ebm, rf, brf, svm, xgb, catboost, mlp,
                     stacking, ensemble]
  # Étape 1 — candidat : meilleure PR-AUC moyenne en CV (feature set de référence).
  # Étape 2 — règle du 1-SE : on retient le plus simple des modèles dont l'écart
  # moyen au meilleur (différences appariées par fold) est au plus une erreur-type,
  # erreur-type corrigée par Nadeau-Bengio.
  simplicity_rule: one_se
  fold_test:
    confidence: 0.95            # pour les IC rapportés (information)
    correction: nadeau_bengio
    report_naive: true
  # Pas d'étape 2 bis en v2 : un seul feature set comparé.
  # Étape 3 — holdout 1996 : battre chaque référence (IC bootstrap > 0).
  holdout_baselines: [dummy, business, logreg_v1]
  # Étape 4 — pas de re-sélection sur le holdout.
  reselect_on_holdout: false

# Ablations du modèle retenu : chiffres seulement, ne changent pas la sélection.
ablations: [no_sex, fs_policytype, smote_nc]
ablation_settings:
  smote_nc:                    # entre l'étage A et l'étage B, train du fold seul
    sampling_strategy: 1.0     # ratio 1:1 (autant de fraudes que de non-fraudes)
    k_neighbors: 5

# Garde-fou : hors --smoke, train.py refuse de tourner tant que ces fichiers
# ne sont pas commités tels quels, ou si le document est encore un brouillon.
preregistration:
  files: [configs/bloc2_v2.yaml, reports/bloc2_v2_decisions.md]
  draft_marker: "Statut : BROUILLON"
